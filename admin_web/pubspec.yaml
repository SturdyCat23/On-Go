name: on_go_console
description: >-
  On Go admin console — the Admin and Moderator web application.

  A separate front end from the On Go mobile app (Client + Mechanic), which
  lives at the repository root. The two meet at packages/on_go_shared, which
  holds the models and API contracts they exchange; see ARCHITECTURE.md.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The shared design system: the same palettes, theme registry, tokens and
  # theme controller the mobile app uses, so both front ends are one theme
  # system rather than two that resemble each other.
  on_go_design:
    path: ../packages/on_go_design

  # Domain models and API contracts shared with the mobile app. Everything
  # this console sends to, or reads from, the other application goes through
  # the interfaces in here.
  on_go_shared:
    path: ../packages/on_go_shared

  # Image selection for the moderator's profile photo and the mobile app's
  # Sign In background. Reads the picked file as bytes, which is what works on
  # the web and what the upload API will take.
  file_picker: ^8.1.4

  # Remembers the console's own appearance choice between visits.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
